<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2"/>
      <stop offset="100%" style="stop-color:#fcb69f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff8f0"/>
      <stop offset="100%" style="stop-color:#f0e8d8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22"/>
      <stop offset="100%" style="stop-color:#ca6f1e"/>
    </linearGradient>
  </defs>

  <!-- Warm sunset sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="100" r="55" fill="#f39c12" opacity="0.6"/>
  <circle cx="680" cy="100" r="40" fill="#f1c40f" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="390" width="800" height="110" fill="#5d4037"/>
  <rect x="0" y="390" width="800" height="15" fill="#6d4c41"/>

  <!-- Path to entrance -->
  <polygon points="330,390 470,390 500,500 300,500" fill="#bcaaa4"/>

  <!-- Bushes -->
  <circle cx="140" cy="395" r="22" fill="#388e3c"/>
  <circle cx="170" cy="388" r="18" fill="#43a047"/>
  <circle cx="115" cy="400" r="15" fill="#2e7d32"/>
  <circle cx="630" cy="395" r="22" fill="#388e3c"/>
  <circle cx="660" cy="388" r="18" fill="#43a047"/>
  <circle cx="608" cy="400" r="15" fill="#2e7d32"/>

  <!-- Building -->
  <rect x="130" y="230" width="540" height="165" fill="url(#wall)"/>

  <!-- Roof with overhang -->
  <polygon points="110,230 400,130 690,230" fill="url(#roof)"/>
  <rect x="108" y="228" width="584" height="12" fill="#a04000"/>

  <!-- Roof tiles horizontal lines -->
  <line x1="110" y1="190" x2="690" y2="190" stroke="#c0580a" stroke-width="2" opacity="0.4"/>
  <line x1="110" y1="210" x2="690" y2="210" stroke="#c0580a" stroke-width="2" opacity="0.4"/>

  <!-- Community centre sign on gable -->
  <rect x="290" y="148" width="220" height="32" fill="#1565c0" rx="4"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">KAMWOKYA COMMUNITY CENTRE</text>

  <!-- Windows -->
  <rect x="155" y="260" width="80" height="85" rx="5" fill="#90caf9"/>
  <line x1="195" y1="260" x2="195" y2="345" stroke="white" stroke-width="2"/>
  <line x1="155" y1="302" x2="235" y2="302" stroke="white" stroke-width="2"/>

  <rect x="265" y="260" width="80" height="85" rx="5" fill="#90caf9"/>
  <line x1="305" y1="260" x2="305" y2="345" stroke="white" stroke-width="2"/>
  <line x1="265" y1="302" x2="345" y2="302" stroke="white" stroke-width="2"/>

  <rect x="455" y="260" width="80" height="85" rx="5" fill="#90caf9"/>
  <line x1="495" y1="260" x2="495" y2="345" stroke="white" stroke-width="2"/>
  <line x1="455" y1="302" x2="535" y2="302" stroke="white" stroke-width="2"/>

  <rect x="565" y="260" width="80" height="85" rx="5" fill="#90caf9"/>
  <line x1="605" y1="260" x2="605" y2="345" stroke="white" stroke-width="2"/>
  <line x1="565" y1="302" x2="645" y2="302" stroke="white" stroke-width="2"/>

  <!-- Main double door -->
  <rect x="355" y="300" width="90" height="95" rx="4" fill="#5d4037"/>
  <rect x="360" y="305" width="38" height="85" rx="3" fill="#795548"/>
  <rect x="402" y="305" width="38" height="85" rx="3" fill="#795548"/>
  <circle cx="398" cy="355" r="4" fill="#ffd54f"/>
  <circle cx="402" cy="355" r="4" fill="#ffd54f"/>
  <!-- Arch -->
  <ellipse cx="400" cy="304" rx="48" ry="14" fill="#5d4037"/>

  <!-- Notice board -->
  <rect x="160" y="355" width="100" height="35" fill="#f9a825" rx="3"/>
  <text x="210" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#333">COMMUNITY NOTICE</text>
  <text x="210" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#555">Hall Available Daily</text>

  <!-- People silhouettes entering -->
  <ellipse cx="365" cy="392" rx="10" ry="12" fill="#555"/>
  <rect x="358" y="404" width="14" height="20" rx="3" fill="#1565c0"/>
  <ellipse cx="435" cy="392" rx="10" ry="12" fill="#555"/>
  <rect x="428" y="404" width="14" height="20" rx="3" fill="#c0392b"/>

  <!-- Flagpole -->
  <rect x="397" y="95" width="4" height="50" fill="#888"/>
  <rect x="401" y="96" width="32" height="20" fill="#c0392b"/>
  <text x="417" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="white">KCCA</text>

  <!-- Label -->
  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.55)"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">Kamwokya Community Centre · Kamwokya Road, Kampala</text>
</svg>
