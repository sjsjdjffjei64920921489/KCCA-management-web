<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81d4fa"/>
      <stop offset="100%" style="stop-color:#e1f5fe"/>
    </linearGradient>
    <linearGradient id="grass1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="grass2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81c784"/>
      <stop offset="100%" style="stop-color:#4caf50"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="48" fill="#fff176" opacity="0.9"/>
  <circle cx="680" cy="80" r="38" fill="#ffee58" opacity="0.8"/>
  <!-- Sun rays -->
  <line x1="680" y1="22" x2="680" y2="10" stroke="#fff176" stroke-width="3" opacity="0.7"/>
  <line x1="722" y1="38" x2="730" y2="28" stroke="#fff176" stroke-width="3" opacity="0.7"/>
  <line x1="738" y1="80" x2="750" y2="80" stroke="#fff176" stroke-width="3" opacity="0.7"/>
  <line x1="630" y1="38" x2="622" y2="28" stroke="#fff176" stroke-width="3" opacity="0.7"/>
  <line x1="614" y1="80" x2="602" y2="80" stroke="#fff176" stroke-width="3" opacity="0.7"/>

  <!-- Clouds -->
  <ellipse cx="150" cy="75" rx="80" ry="28" fill="white" opacity="0.85"/>
  <ellipse cx="200" cy="62" rx="60" ry="22" fill="white" opacity="0.9"/>

  <!-- Ground layers - park lawn -->
  <rect x="0" y="320" width="800" height="180" fill="url(#grass1)"/>
  <ellipse cx="400" cy="320" rx="420" ry="30" fill="url(#grass2)"/>

  <!-- Walking path (curved) -->
  <path d="M 100 500 Q 200 380 400 360 Q 600 340 700 500" fill="none" stroke="#d7ccc8" stroke-width="18"/>
  <path d="M 100 500 Q 200 380 400 360 Q 600 340 700 500" fill="none" stroke="#bcaaa4" stroke-width="14"/>

  <!-- Big trees background left -->
  <rect x="50" y="220" width="20" height="120" fill="#5d4037"/>
  <circle cx="60" cy="200" r="55" fill="#2e7d32"/>
  <circle cx="38" cy="220" r="40" fill="#388e3c"/>
  <circle cx="82" cy="215" r="40" fill="#2e7d32"/>

  <rect x="160" y="240" width="16" height="100" fill="#5d4037"/>
  <circle cx="168" cy="220" r="45" fill="#388e3c"/>
  <circle cx="148" cy="238" r="32" fill="#2e7d32"/>
  <circle cx="188" cy="233" r="32" fill="#43a047"/>

  <!-- Big trees right -->
  <rect x="725" y="220" width="20" height="120" fill="#5d4037"/>
  <circle cx="735" cy="200" r="55" fill="#2e7d32"/>
  <circle cx="713" cy="220" r="40" fill="#388e3c"/>
  <circle cx="757" cy="215" r="40" fill="#2e7d32"/>

  <rect x="620" y="240" width="16" height="100" fill="#5d4037"/>
  <circle cx="628" cy="220" r="45" fill="#388e3c"/>
  <circle cx="608" cy="238" r="32" fill="#2e7d32"/>
  <circle cx="648" cy="233" r="32" fill="#43a047"/>

  <!-- Open air stage -->
  <rect x="300" y="220" width="200" height="110" fill="#5d4037"/>
  <polygon points="280,220 400,160 520,220" fill="#4e342e"/>
  <rect x="278" y="218" width="244" height="8" fill="#3e2723"/>
  <!-- Stage curtains -->
  <rect x="300" y="228" width="30" height="100" fill="#6a0dad" opacity="0.85"/>
  <rect x="470" y="228" width="30" height="100" fill="#6a0dad" opacity="0.85"/>
  <!-- Stage floor lit up -->
  <rect x="330" y="285" width="140" height="45" fill="#ffd54f" opacity="0.3"/>
  <!-- Performer on stage -->
  <ellipse cx="400" cy="295" rx="11" ry="13" fill="#333"/>
  <rect x="393" y="308" width="14" height="22" rx="3" fill="#c62828"/>
  <!-- Mic stand -->
  <rect x="398" y="285" width="3" height="18" fill="#888"/>
  <circle cx="399" cy="283" r="5" fill="#aaa"/>

  <!-- Stage sign -->
  <rect x="335" y="162" width="130" height="22" fill="#1a237e" rx="3"/>
  <text x="400" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#fff">OPEN-AIR STAGE</text>

  <!-- Park benches -->
  <rect x="210" y="365" width="60" height="10" rx="3" fill="#8d6e63"/>
  <rect x="215" y="360" width="8" height="15" rx="2" fill="#6d4c41"/>
  <rect x="257" y="360" width="8" height="15" rx="2" fill="#6d4c41"/>

  <rect x="530" y="365" width="60" height="10" rx="3" fill="#8d6e63"/>
  <rect x="535" y="360" width="8" height="15" rx="2" fill="#6d4c41"/>
  <rect x="577" y="360" width="8" height="15" rx="2" fill="#6d4c41"/>

  <!-- Flower beds -->
  <circle cx="240" cy="400" r="12" fill="#e91e63"/>
  <circle cx="258" cy="395" r="10" fill="#f48fb1"/>
  <circle cx="222" cy="398" r="9" fill="#c2185b"/>
  <circle cx="540" cy="400" r="12" fill="#ff9800"/>
  <circle cx="558" cy="395" r="10" fill="#ffb74d"/>
  <circle cx="522" cy="398" r="9" fill="#f57c00"/>

  <!-- Children playing -->
  <ellipse cx="435" cy="375" rx="9" ry="11" fill="#ffcc80"/>
  <rect x="429" y="386" width="12" height="15" rx="3" fill="#42a5f5"/>
  <ellipse cx="460" cy="372" rx="9" ry="11" fill="#ffcc80"/>
  <rect x="454" y="383" width="12" height="15" rx="3" fill="#ef5350"/>

  <!-- People sitting on bench -->
  <ellipse cx="225" cy="355" rx="8" ry="10" fill="#ffcc80"/>
  <rect x="219" y="365" width="12" height="12" rx="2" fill="#5c6bc0"/>
  <ellipse cx="243" cy="355" rx="8" ry="10" fill="#ffcc80"/>
  <rect x="237" y="365" width="12" height="12" rx="2" fill="#ef9a9a"/>

  <!-- Park sign at entrance -->
  <rect x="355" y="290" width="2" height="38" fill="#888"/>
  <rect x="356" y="285" width="2" height="38" fill="#888"/>

  <!-- Name sign -->
  <rect x="255" y="118" width="290" height="36" fill="#1b5e20" rx="5"/>
  <text x="400" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">KABALAGALA RECREATION PARK</text>

  <!-- Label -->
  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.55)"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">Kabalagala Recreation Park · Bukasa Road, Kampala</text>
</svg>
