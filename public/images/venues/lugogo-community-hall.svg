<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#d4eaf7"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="100%" style="stop-color:#ede5d0"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#5c2d0a"/>
    </linearGradient>
  </defs>

  <!-- Sky with clouds -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <ellipse cx="150" cy="80" rx="80" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="200" cy="70" rx="60" ry="25" fill="white" opacity="0.9"/>
  <ellipse cx="100" cy="90" rx="50" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="620" cy="60" rx="90" ry="28" fill="white" opacity="0.8"/>
  <ellipse cx="670" cy="50" rx="65" ry="22" fill="white" opacity="0.9"/>

  <!-- Ground / lawn -->
  <rect x="0" y="390" width="800" height="110" fill="#3a7d44"/>
  <rect x="0" y="390" width="800" height="20" fill="#4a9d54"/>
  <!-- Path -->
  <rect x="340" y="390" width="120" height="110" fill="#c8b89a"/>

  <!-- Trees left -->
  <rect x="60" y="280" width="18" height="120" fill="#5c3d1a"/>
  <circle cx="69" cy="260" r="50" fill="#2d7a3a"/>
  <circle cx="49" cy="275" r="35" fill="#3a9a48"/>
  <circle cx="89" cy="275" r="35" fill="#2d7a3a"/>

  <!-- Trees right -->
  <rect x="720" y="280" width="18" height="120" fill="#5c3d1a"/>
  <circle cx="729" cy="260" r="50" fill="#2d7a3a"/>
  <circle cx="709" cy="275" r="35" fill="#3a9a48"/>
  <circle cx="749" cy="275" r="35" fill="#2d7a3a"/>

  <!-- Building main body -->
  <rect x="120" y="220" width="560" height="175" fill="url(#wall)"/>

  <!-- Roof / triangle gable -->
  <polygon points="100,220 400,100 700,220" fill="url(#roof)"/>
  <!-- Roof ridge -->
  <line x1="100" y1="220" x2="700" y2="220" stroke="#3d1f06" stroke-width="4"/>

  <!-- Roof tiles pattern -->
  <line x1="250" y1="160" x2="400" y2="100" stroke="#6b3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="190" x2="400" y2="100" stroke="#6b3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="350" y1="205" x2="400" y2="100" stroke="#6b3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="450" y1="205" x2="400" y2="100" stroke="#6b3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="500" y1="190" x2="400" y2="100" stroke="#6b3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="550" y1="160" x2="400" y2="100" stroke="#6b3410" stroke-width="1.5" opacity="0.5"/>

  <!-- Columns -->
  <rect x="175" y="220" width="25" height="175" fill="#d4c8a8" rx="3"/>
  <rect x="255" y="220" width="25" height="175" fill="#d4c8a8" rx="3"/>
  <rect x="335" y="220" width="25" height="175" fill="#d4c8a8" rx="3"/>
  <rect x="440" y="220" width="25" height="175" fill="#d4c8a8" rx="3"/>
  <rect x="520" y="220" width="25" height="175" fill="#d4c8a8" rx="3"/>
  <rect x="600" y="220" width="25" height="175" fill="#d4c8a8" rx="3"/>

  <!-- Windows -->
  <rect x="145" y="255" width="70" height="80" rx="5" fill="#6aa8d4"/>
  <line x1="180" y1="255" x2="180" y2="335" stroke="white" stroke-width="2"/>
  <line x1="145" y1="295" x2="215" y2="295" stroke="white" stroke-width="2"/>

  <rect x="290" y="255" width="70" height="80" rx="5" fill="#6aa8d4"/>
  <line x1="325" y1="255" x2="325" y2="335" stroke="white" stroke-width="2"/>
  <line x1="290" y1="295" x2="360" y2="295" stroke="white" stroke-width="2"/>

  <rect x="475" y="255" width="70" height="80" rx="5" fill="#6aa8d4"/>
  <line x1="510" y1="255" x2="510" y2="335" stroke="white" stroke-width="2"/>
  <line x1="475" y1="295" x2="545" y2="295" stroke="white" stroke-width="2"/>

  <rect x="565" y="255" width="70" height="80" rx="5" fill="#6aa8d4"/>
  <line x1="600" y1="255" x2="600" y2="335" stroke="white" stroke-width="2"/>
  <line x1="565" y1="295" x2="635" y2="295" stroke="white" stroke-width="2"/>

  <!-- Main door -->
  <rect x="355" y="295" width="90" height="100" rx="5" fill="#5c3d1a"/>
  <rect x="368" y="305" width="30" height="90" rx="3" fill="#8B6914"/>
  <rect x="402" y="305" width="30" height="90" rx="3" fill="#8B6914"/>
  <circle cx="400" cy="360" r="4" fill="#d4aa30"/>

  <!-- Door arch -->
  <ellipse cx="400" cy="300" rx="48" ry="15" fill="#5c3d1a"/>

  <!-- Sign board -->
  <rect x="280" y="135" width="240" height="40" fill="#1a5276" rx="5"/>
  <text x="400" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="white">LUGOGO COMMUNITY HALL</text>

  <!-- KCCA flag -->
  <rect x="395" y="95" width="3" height="45" fill="#555"/>
  <rect x="398" y="95" width="30" height="18" fill="#c0392b"/>
  <text x="413" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="white">KCCA</text>

  <!-- Flowers/shrubs -->
  <circle cx="160" cy="395" r="15" fill="#e74c3c"/>
  <circle cx="185" cy="390" r="12" fill="#e91e8c"/>
  <circle cx="600" cy="395" r="15" fill="#f39c12"/>
  <circle cx="625" cy="390" r="12" fill="#e74c3c"/>

  <!-- Label bar -->
  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.55)"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">Lugogo Community Hall · Plot 12, Lugogo Hill Road</text>
</svg>
