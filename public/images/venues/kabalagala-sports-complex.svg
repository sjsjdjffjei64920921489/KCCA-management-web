<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="50%" style="stop-color:#283593"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#1b5e20"/>
      <stop offset="20%"  style="stop-color:#2e7d32"/>
      <stop offset="40%"  style="stop-color:#1b5e20"/>
      <stop offset="60%"  style="stop-color:#2e7d32"/>
      <stop offset="80%"  style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="stand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#455a64"/>
      <stop offset="100%" style="stop-color:#37474f"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="60"  cy="40"  r="1.5" fill="white" opacity="0.9"/>
  <circle cx="180" cy="25"  r="2"   fill="white" opacity="0.8"/>
  <circle cx="320" cy="55"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="480" cy="35"  r="2"   fill="white" opacity="0.9"/>
  <circle cx="620" cy="60"  r="1.5" fill="white" opacity="0.8"/>
  <circle cx="760" cy="20"  r="2"   fill="white" opacity="0.7"/>
  <circle cx="100" cy="85"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="700" cy="80"  r="1"   fill="white" opacity="0.6"/>

  <!-- Floodlight towers + beams -->
  <rect x="82" y="100" width="14" height="230" fill="#546e7a"/>
  <rect x="68" y="95" width="42" height="14" fill="#78909c" rx="3"/>
  <ellipse cx="89" cy="100" rx="21" ry="7" fill="#ffff8d" opacity="0.6"/>
  <polygon points="89,114 30,340 148,340" fill="#fffde7" opacity="0.1"/>

  <rect x="704" y="100" width="14" height="230" fill="#546e7a"/>
  <rect x="690" y="95" width="42" height="14" fill="#78909c" rx="3"/>
  <ellipse cx="711" cy="100" rx="21" ry="7" fill="#ffff8d" opacity="0.6"/>
  <polygon points="711,114 652,340 770,340" fill="#fffde7" opacity="0.1"/>

  <!-- Second pair of floodlights -->
  <rect x="172" y="140" width="10" height="190" fill="#546e7a"/>
  <rect x="163" y="136" width="28" height="10" fill="#78909c" rx="2"/>
  <ellipse cx="177" cy="140" rx="14" ry="5" fill="#ffff8d" opacity="0.5"/>

  <rect x="618" y="140" width="10" height="190" fill="#546e7a"/>
  <rect x="609" y="136" width="28" height="10" fill="#78909c" rx="2"/>
  <ellipse cx="623" cy="140" rx="14" ry="5" fill="#ffff8d" opacity="0.5"/>

  <!-- Main pitch -->
  <rect x="60" y="330" width="680" height="145" fill="url(#pitch)"/>

  <!-- Pitch markings (white) -->
  <rect x="75" y="335" width="650" height="135" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="400" y1="335" x2="400" y2="470" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <circle cx="400" cy="402" r="45" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  <circle cx="400" cy="402" r="4" fill="white" opacity="0.9"/>
  <!-- Penalty areas -->
  <rect x="75" y="357" width="115" height="91" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <rect x="610" y="357" width="115" height="91" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Goal boxes -->
  <rect x="75" y="373" width="52" height="59" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <rect x="673" y="373" width="52" height="59" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Goals -->
  <rect x="42"  y="377" width="8"  height="50" fill="#ddd"/>
  <rect x="42"  y="377" width="36" height="5"  fill="#ddd"/>
  <rect x="78"  y="377" width="5"  height="50" fill="#ddd"/>
  <rect x="750" y="377" width="8"  height="50" fill="#ddd"/>
  <rect x="722" y="377" width="36" height="5"  fill="#ddd"/>
  <rect x="750" y="377" width="5"  height="50" fill="#ddd"/>

  <!-- Basketball court (right side inset) -->
  <rect x="540" y="200" width="220" height="130" fill="#c8702a" rx="4"/>
  <rect x="548" y="208" width="204" height="114" fill="none" stroke="#ddd" stroke-width="2"/>
  <line x1="650" y1="208" x2="650" y2="322" stroke="#ddd" stroke-width="2"/>
  <circle cx="650" cy="265" r="28" fill="none" stroke="#ddd" stroke-width="2"/>
  <circle cx="650" cy="265" r="5" fill="#ddd" opacity="0.8"/>
  <!-- Hoops -->
  <rect x="548" y="252" width="8" height="4" fill="#ff6f00"/>
  <circle cx="563" cy="254" r="8" fill="none" stroke="#ff6f00" stroke-width="2.5"/>
  <rect x="744" y="252" width="8" height="4" fill="#ff6f00"/>
  <circle cx="737" cy="254" r="8" fill="none" stroke="#ff6f00" stroke-width="2.5"/>
  <!-- Court label -->
  <text x="650" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ddd" opacity="0.8">BASKETBALL COURT</text>

  <!-- Main grandstand -->
  <polygon points="60,330 740,330 720,185 80,185" fill="url(#stand)"/>
  <rect x="60" y="328" width="680" height="6" fill="#546e7a"/>
  <!-- Stand roof -->
  <polygon points="72,185 728,185 710,168 90,168" fill="#263238"/>
  <rect x="72" y="183" width="656" height="5" fill="#37474f"/>

  <!-- Seat rows with crowd colors -->
  <line x1="82" y1="205" x2="718" y2="205" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="82" y1="225" x2="718" y2="225" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="82" y1="245" x2="718" y2="245" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="82" y1="265" x2="718" y2="265" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="82" y1="285" x2="718" y2="285" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="82" y1="305" x2="718" y2="305" stroke="#546e7a" stroke-width="1.5"/>

  <!-- Crowd colorful seats row 1 -->
  <rect x="92"  y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="114" y="196" width="15" height="8" rx="2" fill="#1e88e5"/>
  <rect x="136" y="196" width="15" height="8" rx="2" fill="#ffee58"/>
  <rect x="158" y="196" width="15" height="8" rx="2" fill="#43a047"/>
  <rect x="180" y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="202" y="196" width="15" height="8" rx="2" fill="#1e88e5"/>
  <rect x="224" y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="246" y="196" width="15" height="8" rx="2" fill="#ffee58"/>
  <rect x="268" y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="290" y="196" width="15" height="8" rx="2" fill="#43a047"/>
  <rect x="312" y="196" width="15" height="8" rx="2" fill="#1e88e5"/>
  <rect x="334" y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="356" y="196" width="15" height="8" rx="2" fill="#ffee58"/>
  <rect x="378" y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="400" y="196" width="15" height="8" rx="2" fill="#1e88e5"/>
  <rect x="422" y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="444" y="196" width="15" height="8" rx="2" fill="#43a047"/>
  <rect x="466" y="196" width="15" height="8" rx="2" fill="#ffee58"/>
  <rect x="488" y="196" width="15" height="8" rx="2" fill="#e53935"/>
  <rect x="510" y="196" width="15" height="8" rx="2" fill="#1e88e5"/>

  <!-- Scoreboard -->
  <rect x="280" y="110" width="240" height="55" fill="#212121" rx="6"/>
  <text x="400" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#00e676">KABALAGALA SPORTS COMPLEX</text>
  <text x="340" y="152" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ff5252">HOME 3</text>
  <text x="460" y="152" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#40c4ff">AWAY 2</text>

  <!-- Ball on pitch -->
  <circle cx="400" cy="402" r="10" fill="white" stroke="#333" stroke-width="1.5"/>
  <polygon points="400,394 406,399 404,407 396,407 394,399" fill="#444" opacity="0.7"/>

  <!-- Label -->
  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.6)"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">Kabalagala Sports Complex · Kabalagala-Mutungo Road</text>
</svg>
