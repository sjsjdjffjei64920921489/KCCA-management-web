<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#56a0d3"/>
      <stop offset="100%" style="stop-color:#c9e8f5"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Clouds -->
  <ellipse cx="120" cy="70" rx="70" ry="25" fill="white" opacity="0.9"/>
  <ellipse cx="160" cy="60" rx="55" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="650" cy="80" rx="80" ry="28" fill="white" opacity="0.9"/>
  <ellipse cx="700" cy="65" rx="60" ry="22" fill="white" opacity="0.8"/>

  <!-- Far background buildings (Kampala skyline) -->
  <rect x="50"  y="220" width="40" height="120" fill="#8fa8c8" opacity="0.5"/>
  <rect x="100" y="200" width="30" height="140" fill="#7a95b8" opacity="0.5"/>
  <rect x="680" y="215" width="45" height="125" fill="#8fa8c8" opacity="0.5"/>
  <rect x="735" y="230" width="30" height="110" fill="#7a95b8" opacity="0.5"/>

  <!-- Ground base -->
  <rect x="0" y="340" width="800" height="160" fill="url(#grass)"/>

  <!-- Pitch markings -->
  <!-- Outer boundary -->
  <rect x="80" y="345" width="640" height="140" fill="none" stroke="white" stroke-width="3" opacity="0.7"/>
  <!-- Centre line -->
  <line x1="400" y1="345" x2="400" y2="485" stroke="white" stroke-width="3" opacity="0.7"/>
  <!-- Centre circle -->
  <circle cx="400" cy="415" r="50" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Penalty areas -->
  <rect x="80" y="375" width="120" height="80" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <rect x="600" y="375" width="120" height="80" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Goal boxes -->
  <rect x="80" y="390" width="55" height="50" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <rect x="665" y="390" width="55" height="50" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Centre dot -->
  <circle cx="400" cy="415" r="5" fill="white" opacity="0.8"/>

  <!-- Goal posts left -->
  <rect x="55"  y="395" width="8" height="40" fill="#ddd"/>
  <rect x="55"  y="395" width="30" height="5" fill="#ddd"/>
  <rect x="83"  y="395" width="5" height="40" fill="#ddd"/>

  <!-- Goal posts right -->
  <rect x="737" y="395" width="8" height="40" fill="#ddd"/>
  <rect x="712" y="395" width="30" height="5" fill="#ddd"/>
  <rect x="712" y="395" width="5" height="40" fill="#ddd"/>

  <!-- Perimeter fence -->
  <line x1="60"  y1="340" x2="740" y2="340" stroke="#888" stroke-width="3"/>
  <line x1="60"  y1="340" x2="60"  y2="490" stroke="#888" stroke-width="3"/>
  <line x1="740" y1="340" x2="740" y2="490" stroke="#888" stroke-width="3"/>
  <!-- Fence posts -->
  <rect x="57"  y="330" width="6" height="15" fill="#aaa"/>
  <rect x="137" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="217" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="297" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="377" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="457" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="537" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="617" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="697" y="330" width="6" height="15" fill="#aaa"/>
  <rect x="737" y="330" width="6" height="15" fill="#aaa"/>

  <!-- Spectator stand left -->
  <polygon points="20,340 20,200 100,200 100,340" fill="#c0a080"/>
  <polygon points="20,200 100,200 100,210 20,210" fill="#a08060"/>
  <!-- Seat rows -->
  <line x1="20" y1="230" x2="100" y2="230" stroke="#888" stroke-width="1.5"/>
  <line x1="20" y1="255" x2="100" y2="255" stroke="#888" stroke-width="1.5"/>
  <line x1="20" y1="280" x2="100" y2="280" stroke="#888" stroke-width="1.5"/>
  <line x1="20" y1="305" x2="100" y2="305" stroke="#888" stroke-width="1.5"/>
  <!-- Spectator silhouettes -->
  <circle cx="35" cy="225" r="5" fill="#555"/>
  <circle cx="55" cy="225" r="5" fill="#c0392b"/>
  <circle cx="75" cy="225" r="5" fill="#555"/>
  <circle cx="35" cy="250" r="5" fill="#2980b9"/>
  <circle cx="55" cy="250" r="5" fill="#555"/>
  <circle cx="75" cy="250" r="5" fill="#27ae60"/>

  <!-- Spectator stand right -->
  <polygon points="700,340 700,200 780,200 780,340" fill="#c0a080"/>
  <polygon points="700,200 780,200 780,210 700,210" fill="#a08060"/>
  <line x1="700" y1="230" x2="780" y2="230" stroke="#888" stroke-width="1.5"/>
  <line x1="700" y1="255" x2="780" y2="255" stroke="#888" stroke-width="1.5"/>
  <line x1="700" y1="280" x2="780" y2="280" stroke="#888" stroke-width="1.5"/>
  <line x1="700" y1="305" x2="780" y2="305" stroke="#888" stroke-width="1.5"/>
  <circle cx="715" cy="225" r="5" fill="#e74c3c"/>
  <circle cx="735" cy="225" r="5" fill="#555"/>
  <circle cx="755" cy="225" r="5" fill="#3498db"/>
  <circle cx="715" cy="250" r="5" fill="#555"/>
  <circle cx="735" cy="250" r="5" fill="#f1c40f"/>

  <!-- Signage -->
  <rect x="310" y="185" width="180" height="38" fill="#1a5276" rx="5"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">LUGOGO MULTIPURPOSE GROUND</text>

  <!-- Label -->
  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.55)"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">Lugogo Multipurpose Ground · Lugogo Bypass, Kampala</text>
</svg>
