<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#bbdefb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b3e5fc;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eceff1"/>
      <stop offset="100%" style="stop-color:#cfd8dc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Clouds -->
  <ellipse cx="120" cy="60" rx="80" ry="28" fill="white" opacity="0.9"/>
  <ellipse cx="680" cy="70" rx="90" ry="30" fill="white" opacity="0.9"/>

  <!-- Ground / plaza -->
  <rect x="0" y="400" width="800" height="100" fill="#eceff1"/>
  <rect x="0" y="400" width="800" height="12" fill="#b0bec5"/>
  <!-- Plaza tiles -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="100" y1="400" x2="100" y2="500" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="200" y1="400" x2="200" y2="500" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="300" y1="400" x2="300" y2="500" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="400" y1="400" x2="400" y2="500" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="500" y1="400" x2="500" y2="500" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="600" y1="400" x2="600" y2="500" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="700" y1="400" x2="700" y2="500" stroke="#cfd8dc" stroke-width="1"/>

  <!-- Fountain -->
  <ellipse cx="400" cy="440" rx="50" ry="18" fill="#81d4fa"/>
  <ellipse cx="400" cy="440" rx="35" ry="12" fill="#4fc3f7"/>
  <circle cx="400" cy="440" r="10" fill="#29b6f6"/>
  <!-- Water sprays -->
  <line x1="400" y1="440" x2="390" y2="418" stroke="#b3e5fc" stroke-width="2" opacity="0.8"/>
  <line x1="400" y1="440" x2="410" y2="418" stroke="#b3e5fc" stroke-width="2" opacity="0.8"/>
  <line x1="400" y1="440" x2="400" y2="415" stroke="#b3e5fc" stroke-width="3" opacity="0.9"/>
  <line x1="400" y1="440" x2="385" y2="422" stroke="#b3e5fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="400" y1="440" x2="415" y2="422" stroke="#b3e5fc" stroke-width="1.5" opacity="0.7"/>

  <!-- Modern glass building - main tower -->
  <rect x="200" y="150" width="400" height="255" fill="url(#building)"/>

  <!-- Glass curtain wall panels -->
  <rect x="210" y="160" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="275" y="160" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="340" y="160" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="405" y="160" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="470" y="160" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="535" y="160" width="55" height="40" rx="2" fill="url(#glass)"/>

  <rect x="210" y="210" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="275" y="210" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="340" y="210" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="405" y="210" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="470" y="210" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="535" y="210" width="55" height="40" rx="2" fill="url(#glass)"/>

  <rect x="210" y="260" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="275" y="260" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="340" y="260" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="405" y="260" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="470" y="260" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="535" y="260" width="55" height="40" rx="2" fill="url(#glass)"/>

  <rect x="210" y="310" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="275" y="310" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="340" y="310" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="405" y="310" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="470" y="310" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="535" y="310" width="55" height="40" rx="2" fill="url(#glass)"/>

  <rect x="210" y="360" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="275" y="360" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="340" y="360" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="405" y="360" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="470" y="360" width="55" height="40" rx="2" fill="url(#glass)"/>
  <rect x="535" y="360" width="55" height="40" rx="2" fill="url(#glass)"/>

  <!-- Top accent band -->
  <rect x="200" y="150" width="400" height="12" fill="#0277bd"/>
  <!-- Bottom accent band -->
  <rect x="200" y="393" width="400" height="8" fill="#0277bd"/>

  <!-- Entrance canopy -->
  <polygon points="310,398 490,398 510,415 290,415" fill="#0288d1" opacity="0.8"/>
  <!-- Glass entrance doors -->
  <rect x="340" y="360" width="55" height="45" rx="2" fill="#b3e5fc" opacity="0.9"/>
  <rect x="405" y="360" width="55" height="45" rx="2" fill="#b3e5fc" opacity="0.9"/>
  <!-- Door handles -->
  <rect x="368" y="380" width="4" height="12" rx="2" fill="#0277bd"/>
  <rect x="428" y="380" width="4" height="12" rx="2" fill="#0277bd"/>

  <!-- Left wing / lower reception block -->
  <rect x="100" y="270" width="105" height="135" fill="#eceff1"/>
  <rect x="100" y="270" width="105" height="8" fill="#0277bd"/>
  <rect x="112" y="285" width="35" height="30" rx="2" fill="url(#glass)"/>
  <rect x="158" y="285" width="35" height="30" rx="2" fill="url(#glass)"/>
  <rect x="112" y="325" width="35" height="30" rx="2" fill="url(#glass)"/>
  <rect x="158" y="325" width="35" height="30" rx="2" fill="url(#glass)"/>

  <!-- Right wing -->
  <rect x="595" y="270" width="105" height="135" fill="#eceff1"/>
  <rect x="595" y="270" width="105" height="8" fill="#0277bd"/>
  <rect x="607" y="285" width="35" height="30" rx="2" fill="url(#glass)"/>
  <rect x="653" y="285" width="35" height="30" rx="2" fill="url(#glass)"/>
  <rect x="607" y="325" width="35" height="30" rx="2" fill="url(#glass)"/>
  <rect x="653" y="325" width="35" height="30" rx="2" fill="url(#glass)"/>

  <!-- Rooftop telecom/satellite -->
  <rect x="395" y="140" width="8" height="18" fill="#546e7a"/>
  <circle cx="399" cy="138" r="10" fill="none" stroke="#78909c" stroke-width="3"/>
  <circle cx="399" cy="138" r="5" fill="#90a4ae"/>

  <!-- Building sign -->
  <rect x="250" y="110" width="300" height="36" fill="#01579b" rx="5"/>
  <text x="400" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">KABALAGALA CONFERENCE CENTRE</text>

  <!-- People in plaza -->
  <ellipse cx="280" cy="408" rx="9" ry="11" fill="#888"/>
  <rect x="274" y="419" width="12" height="18" rx="3" fill="#1565c0"/>
  <ellipse cx="520" cy="408" rx="9" ry="11" fill="#888"/>
  <rect x="514" y="419" width="12" height="18" rx="3" fill="#880e4f"/>

  <!-- Label -->
  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.55)"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">Kabalagala Conference Centre · Plot 45, Ggaba Road</text>
</svg>
